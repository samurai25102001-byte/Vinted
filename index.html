<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b7f86">
<title>Il mio Vinted</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f5f6f4;--card:#ffffff;--ink:#1c2321;--ink2:#56615e;--ink3:#8a9491;--line:#e3e7e5;
  --accent:#0b7f86;--accent-soft:#dff1f1;--bar:#2a9aa1;--good:#1f7a3f;--bad:#b3261e;--warn:#9a6a00;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121615;--card:#1b2120;--ink:#eef2f1;--ink2:#aab5b2;--ink3:#78837f;--line:#2b3331;
  --accent:#4fc3c9;--accent-soft:#18393a;--bar:#3fb0b7;--good:#6fcf8f;--bad:#f28b82;--warn:#e6b84d;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px}
header h1{margin:0;font-size:22px;letter-spacing:-.3px}
header .sub{color:var(--ink3);font-size:13px}
main{padding:0 12px 110px;max-width:760px;margin:0 auto}
.banner{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.banner a{color:var(--accent);font-weight:600}
.banner.err{background:#fbe9e7;color:#8c1d18}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:18px;bottom:82px;z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--radius);padding:10px;border:1px solid var(--line);cursor:pointer}
.thumb{flex:none;width:58px;height:58px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--accent);font-weight:700;font-size:20px}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex:none}
.price{font-weight:700}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;margin-top:3px;font-weight:600}
.b-sold{background:#e3f4e8;color:var(--good)}.b-sale{background:var(--accent-soft);color:var(--accent)}.b-off{background:var(--line);color:var(--ink2)}.b-todo{background:#fff3d6;color:var(--warn)}
@media (prefers-color-scheme: dark){.b-sold{background:#1d3324}.b-todo{background:#3a3016}}
.empty{text-align:center;color:var(--ink3);padding:40px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.card h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .l{font-size:12px;color:var(--ink2)}.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:150px;margin-top:12px}
.mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;position:relative}
.mbar{width:70%;max-width:26px;background:var(--bar);border-radius:4px 4px 0 0;min-height:0}
.mcol.sel .mbar{background:var(--accent)}
.mcol.dim .mbar{opacity:.35}
.mval{font-size:10px;color:var(--ink2);margin-bottom:2px;font-variant-numeric:tabular-nums}
.mlab{font-size:10px;color:var(--ink3);margin-top:4px}
.mcol.sel .mlab{color:var(--accent);font-weight:700}
.hb{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.hb .n{width:38%;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{flex:1;height:14px;position:relative}
.hb .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.hb .v{font-size:12px;color:var(--ink2);width:92px;text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:600}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
label.f input,label.f select,label.f textarea{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:15px;color:var(--ink);width:100%}
.result{font-size:17px;margin:4px 0 0}
.result b{font-size:28px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none}
.sheet.open{display:block}
.sheet .top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);z-index:2}
.sheet .top h2{margin:0;font-size:17px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.full{width:100%;padding:13px}
.form{padding:14px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.photo{width:100%;aspect-ratio:4/3;border-radius:var(--radius);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:var(--accent);border:2px dashed var(--line);cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:999px;padding:5px 10px;font-size:12px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px}
.toggle input{width:20px;height:20px}
.hint{font-size:12px;color:var(--ink3)}
.profitbox{padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.tip{font-size:12px;color:var(--ink2);margin-top:8px;min-height:16px}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">Articoli</h1>
  <div class="sub" id="hSub">Caricamento…</div>
</header>
<main>
  <div id="banner"></div>
  <section id="v-items"></section>
  <section id="v-stats" hidden></section>
  <section id="v-explore" hidden></section>
  <section id="v-backup" hidden></section>
</main>
<button class="fab" id="fab" aria-label="Nuovo articolo">+</button>
<nav class="tabs">
  <button data-v="items" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Articoli</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Statistiche</button>
  <button data-v="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Esplora</button>
  <button data-v="backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Backup</button>
</nav>

<div class="sheet" id="sheet">
  <div class="top">
    <button class="btn" id="btnCancel">Annulla</button>
    <h2 id="sheetTitle">Nuovo articolo</h2>
    <button class="btn primary" id="btnSave">Salva</button>
  </div>
  <form class="form" id="form" autocomplete="off">
    <div class="photo" id="photoBox"><span>📷 Aggiungi foto di copertina</span></div>
    <input type="file" id="photoInput" accept="image/*" hidden>
    <label class="f">Titolo *<input name="title" required placeholder="es. Felpa Nike con cappuccio"></label>
    <div class="row2">
      <label class="f">Marca<input name="brand" list="dl-brand" placeholder="es. Nike"></label>
      <label class="f">Reparto<select name="macro"></select></label>
    </div>
    <label class="f">Categoria<select name="category"></select></label>
    <div class="row2">
      <label class="f">Taglia<input name="size" list="dl-size" placeholder="es. M, 42, 10 anni / 140 cm"></label>
      <label class="f">Condizioni<select name="condition"></select></label>
    </div>
    <label class="f">Colore<input name="color" list="dl-color" placeholder="es. Nero"></label>
    <div class="row3">
      <label class="f">Pagato €<input name="buyPrice" inputmode="decimal" placeholder="0"></label>
      <label class="f">Prezzo annuncio €<input name="listPrice" inputmode="decimal"></label>
      <label class="f">Venduto a €<input name="sellPrice" inputmode="decimal"></label>
    </div>
    <div class="row2">
      <label class="f">Stato<select name="status">
        <option value="in_vendita">In vendita</option>
        <option value="venduto">Venduto</option>
        <option value="ritirato">Ritirato / tenuto</option>
      </select></label>
      <label class="f">Data caricamento<input type="date" name="listedDate"></label>
    </div>
    <label class="f" id="soldWrap">Data vendita<input type="date" name="soldDate"></label>
    <button type="button" class="btn full" id="btnSold">✓ Segna come venduto oggi</button>
    <label class="toggle"><input type="checkbox" name="contoTerzi"> Venduto per conto di un'altra persona</label>
    <label class="f" id="myProfitWrap" hidden>Mia parte / commissione €<input name="myProfit" inputmode="decimal" placeholder="0"></label>
    <div class="profitbox" id="profitBox"></div>
    <label class="f">Note<textarea name="notes" rows="3"></textarea></label>
    <div class="hint" id="legacyHint"></div>
    <button type="button" class="btn full danger" id="btnDelete">Elimina articolo</button>
  </form>
</div>

<div class="modal" id="modal"><div class="box"><div id="modalText"></div><div class="acts"><button class="btn" id="mNo">Annulla</button><button class="btn primary" id="mYes">Conferma</button></div></div></div>
<div class="toast" id="toast"></div>
<datalist id="dl-brand"></datalist><datalist id="dl-size"></datalist><datalist id="dl-color"></datalist>

<script>
"use strict";
// ---------- Vinted taxonomy ----------
const MACROS=["Uomo","Donna","Bambino","Bambina","Articoli griffati","Casa","Elettronica","Libri e media","Hobby e collezionismo","Sport"];
const CLOTHES=["Top e t-shirt","Maglioni e felpe","Cappotti e giacche","Jeans","Pantaloni","Pantaloncini","Completi e blazer","Set e completi","Costumi da bagno","Calzini e intimo","Abbigliamento sportivo","Indumenti da notte","Altro abbigliamento"];
const WOMEN_EXTRA=["Abiti","Gonne","Tute jumpsuit e playsuit","Lingerie"];
const SHOES=["Scarpe · Sneakers","Scarpe · Scarpe sportive","Scarpe · Stivali","Scarpe · Sandali","Scarpe · Ciabatte e infradito","Scarpe · Scarpe formali","Scarpe · Mocassini e francesine","Scarpe · Altre scarpe"];
const ACC=["Accessori · Borse e zaini","Accessori · Cappelli e berretti","Accessori · Cinture","Accessori · Gioielli e orologi","Accessori · Occhiali da sole","Accessori · Sciarpe e guanti","Accessori · Altri accessori"];
const OTHER_BY={
  "Casa":["Tessili per la casa","Decorazioni","Cucina e tavola","Altro"],
  "Elettronica":["Videogiochi e console","Smartphone e tablet","Audio e cuffie","Accessori tech","Altro"],
  "Libri e media":["Libri","Giochi da tavolo","Musica e vinili","Film","Videogiochi e console","Altro"],
  "Hobby e collezionismo":["Carte collezionabili","Modellismo","Collezionismo","Altro"],
  "Sport":["Abbigliamento sportivo","Attrezzatura","Ciclismo","Calcio","Altro"]
};
const KIDS_EXTRA=["Giocattoli","Articoli per la scuola","Altri articoli per bambini"];
function categoriesFor(m){
  if(OTHER_BY[m]) return OTHER_BY[m];
  if(m==="Donna"||m==="Bambina") return [...CLOTHES.slice(0,6),...WOMEN_EXTRA,...CLOTHES.slice(6),...SHOES,...ACC,...(m==="Donna"?["Bellezza"]:KIDS_EXTRA)];
  if(m==="Bambino") return [...CLOTHES,...SHOES,...ACC,...KIDS_EXTRA];
  if(m==="Uomo"||m==="Articoli griffati") return [...CLOTHES,...SHOES,...ACC,"Cura del corpo"];
  // nessun reparto: tutto
  return [...new Set([...CLOTHES,...WOMEN_EXTRA,...SHOES,...ACC,...KIDS_EXTRA,...Object.values(OTHER_BY).flat(),"Bellezza","Cura del corpo"])];
}
const CONDITIONS=["Nuovo con cartellino","Nuovo senza cartellino","Ottime","Buone","Discrete"];
const ADULT_SIZES=["XXS","XS","S","M","L","XL","XXL","XXXL","Taglia unica"];
const SHOE_SIZES=Array.from({length:14},(_,i)=>String(35+i));
const KID_SIZES=["Neonato","12 mesi / 80 cm","18 mesi / 86 cm","2 anni / 92 cm","3 anni / 98 cm","4 anni / 104 cm","5 anni / 110 cm","6 anni / 116 cm","7 anni / 122 cm","8 anni / 128 cm","9 anni / 134 cm","10 anni / 140 cm","11 anni / 146 cm","12 anni / 152 cm","13 anni / 158 cm","14 anni / 164 cm","15 anni / 170 cm","16 anni / 176 cm"];
const COLORS=["Nero","Bianco","Grigio","Blu","Azzurro","Rosso","Verde","Giallo","Arancione","Rosa","Viola","Marrone","Beige","Multicolore"];
const MONTHS=["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
const MONTHS_L=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const eur0=n=>(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?Math.round(n*100)/100:null};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const isSold=it=>it.status==="venduto";
const profitOf=it=>!isSold(it)?0:it.contoTerzi?(+it.myProfit||0):((+it.sellPrice||0)-(+it.buyPrice||0));
const soldYear=it=>it.soldDate?it.soldDate.slice(0,4):null;
const soldMonth=it=>it.soldDate?+it.soldDate.slice(5,7):null;
const needsReview=it=>it.legacy&&!it.reviewed;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("show"),1800)}
function confirmBox(html){return new Promise(r=>{$("#modalText").innerHTML=html;$("#modal").classList.add("open");const done=v=>{$("#modal").classList.remove("open");$("#mYes").onclick=$("#mNo").onclick=null;r(v)};$("#mYes").onclick=()=>done(true);$("#mNo").onclick=()=>done(false)})}

// ---------- storage (IndexedDB, tutto sul telefono) ----------
let items=[]; let mode="loading"; let idb=null; const photoURLs=new Map();
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("vinted-manager",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("items",{keyPath:"id"});d.createObjectStore("photos");d.createObjectStore("meta")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function req2p(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function store(name,mode){return idb.transaction(name,mode||"readonly").objectStore(name)}
function txDone(t){return new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error)})}
const getMeta=k=>req2p(store("meta").get(k));
const setMeta=(k,v)=>req2p(store("meta","readwrite").put(v,k));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function photoSrc(it){ if(it.photoId&&photoURLs.has(it.photoId)) return photoURLs.get(it.photoId); return it.photoData||""; }
async function loadPhotos(){
  const st=store("photos"); const keys=await req2p(st.getAllKeys()); const vals=await req2p(store("photos").getAll());
  photoURLs.forEach(u=>URL.revokeObjectURL(u)); photoURLs.clear();
  keys.forEach((k,i)=>photoURLs.set(k,URL.createObjectURL(vals[i])));
}
async function init(){
  render();
  try{ idb=await openDB(); }catch(e){ setBanner("Il browser non permette di salvare dati (forse sei in navigazione in incognito).","err"); return; }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  items=await req2p(store("items").getAll());
  if(!items.length && !(await getMeta("storicoDone"))){
    try{
      const r=await fetch("storico.json",{cache:"no-store"});
      if(r.ok){ const d=await r.json(); const t=idb.transaction("items","readwrite"); const st=t.objectStore("items");
        (d.items||[]).forEach(it=>{ if(it&&it.id&&it.title) st.put(it); }); await txDone(t);
        await setMeta("storicoDone",true); items=await req2p(store("items").getAll());
        setTimeout(()=>toast("Storico caricato: "+items.length+" articoli"),300); }
    }catch(e){}
  }
  await loadPhotos();
  mode="idb"; render(); backupReminder();
}
async function putItem(id,data){
  id=id||newId("i");
  const rec={...data,id};
  await req2p(store("items","readwrite").put(rec));
  const i=items.findIndex(x=>x.id===id); if(i>=0) items[i]=rec; else items.push(rec);
  await setMeta("dirty",true);
  render(); return id;
}
async function delItem(id){
  const it=items.find(x=>x.id===id);
  await req2p(store("items","readwrite").delete(id));
  if(it&&it.photoId) await delPhoto(it.photoId);
  items=items.filter(x=>x.id!==id); await setMeta("dirty",true); render();
}
async function savePhoto(blob){ const id=newId("p"); await req2p(store("photos","readwrite").put(blob,id)); photoURLs.set(id,URL.createObjectURL(blob)); return id; }
async function delPhoto(id){ try{ await req2p(store("photos","readwrite").delete(id)); }catch(e){} if(photoURLs.has(id)){URL.revokeObjectURL(photoURLs.get(id));photoURLs.delete(id);} }
function setBanner(t,cls){ $("#banner").innerHTML=t?`<div class="banner ${cls||""}">${t}</div>`:""; }
async function backupReminder(){
  if(!items.length){ setBanner(`Nessun articolo. Se hai il file <b>vinted-storico.json</b> (lo storico del PDF) o un backup, importalo da <a href="#" onclick="goTab('backup');return false">Backup</a>.`); return; }
  const last=await getMeta("lastBackup"), dirty=await getMeta("dirty");
  if(dirty&&(!last||Date.now()-last>14*864e5)) setBanner(`Ultimo backup: ${last?new Date(last).toLocaleDateString("it-IT"):"mai"}. <a href="#" onclick="goTab('backup');return false">Fai un backup</a> per non perdere i dati se cambi telefono.`);
  else setBanner("");
}

// ---------- backup ----------
const blobToDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function dataURLToBlob(u){ return (await fetch(u)).blob(); }
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000); }
async function exportBackup(){
  const photos={}; const keys=await req2p(store("photos").getAllKeys()); const vals=await req2p(store("photos").getAll());
  for(let i=0;i<keys.length;i++) photos[keys[i]]=await blobToDataURL(vals[i]);
  const data={app:"vinted-manager",version:1,exportedAt:new Date().toISOString(),items,photos};
  download(new Blob([JSON.stringify(data)],{type:"application/json"}),"vinted-backup-"+today()+".json");
  await setMeta("lastBackup",Date.now()); await setMeta("dirty",false); toast("Backup creato"); render(); backupReminder();
}
function exportCSV(){
  const cols=[["title","Titolo"],["brand","Marca"],["macro","Reparto"],["category","Categoria"],["size","Taglia"],["condition","Condizioni"],["color","Colore"],["status","Stato"],["buyPrice","Pagato"],["listPrice","Prezzo annuncio"],["sellPrice","Venduto a"],["listedDate","Data caricamento"],["soldDate","Data vendita"],["contoTerzi","Conto terzi"],["notes","Note"]];
  const q=v=>{v=v==null?"":typeof v==="number"?String(v).replace(".",","):String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[cols.map(c=>c[1]).join(";"),...items.map(it=>[...cols.map(([k])=>k==="contoTerzi"?(it[k]?"sì":""):it[k]),].map(q).join(";")+";"+q(profitOf(it)))];
  rows[0]+=";Profitto";
  download(new Blob(["﻿"+rows.join("\n")],{type:"text/csv"}),"vinted-"+today()+".csv");
}
async function importBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast("File non valido"); return; }
  if(!data||!Array.isArray(data.items)){ toast("Non è un backup di questa app"); return; }
  const merge=items.length>0;
  const ok=await confirmBox(merge?`Il file contiene <b>${data.items.length}</b> articoli.<br><br>Gli articoli con lo stesso codice verranno sostituiti, gli altri aggiunti. I ${items.length} articoli attuali non vengono cancellati.`:`Importare <b>${data.items.length}</b> articoli?`);
  if(!ok) return;
  const photos=data.photos||{};
  for(const [k,u] of Object.entries(photos)){ try{ await req2p(store("photos","readwrite").put(await dataURLToBlob(u),k)); }catch(e){} }
  const t=idb.transaction("items","readwrite"); const st=t.objectStore("items");
  data.items.forEach(it=>{ if(it&&it.id&&it.title) st.put(it); });
  await txDone(t);
  items=await req2p(store("items").getAll()); await loadPhotos(); await setMeta("dirty",true);
  toast("Importati "+data.items.length+" articoli"); render(); backupReminder();
}
async function wipeAll(){
  if(!await confirmBox("Cancellare <b>tutti</b> gli articoli e le foto da questo telefono? Fallo solo se hai un backup.")) return;
  for(const n of ["items","photos"]) await req2p(store(n,"readwrite").clear());
  items=[]; await loadPhotos(); render(); backupReminder();
}
function renderBackup(){
  const nPh=photoURLs.size;
  $("#v-backup").innerHTML=`<div class="card"><h3>I tuoi dati</h3><div class="hint" style="font-size:14px">${items.length} articoli e ${nPh} foto, salvati solo su questo telefono. L'app funziona anche senza internet.</div><div class="hint" id="lastB" style="margin-top:6px"></div></div>
  <div class="card"><h3>Backup</h3><div class="hint" style="margin-bottom:10px">Crea un file con tutti gli articoli e le foto. Tienilo su Google Drive o mandalo a te stesso: ti serve se cambi telefono o cancelli i dati di Chrome.</div>
  <button class="btn primary full" id="bExp">Scarica backup (.json)</button>
  <button class="btn full" style="margin-top:8px" id="bImp">Importa backup o storico</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden></div>
  <div class="card"><h3>Excel</h3><div class="hint" style="margin-bottom:10px">Esporta l'elenco in CSV, apribile con Excel o Google Sheets.</div><button class="btn full" id="bCsv">Esporta CSV</button></div>
  <div class="card"><h3>Zona pericolosa</h3><button class="btn full danger" id="bWipe">Cancella tutti i dati</button></div>`;
  getMeta("lastBackup").then(l=>{const e=$("#lastB");if(e)e.textContent="Ultimo backup: "+(l?new Date(l).toLocaleString("it-IT"):"mai")});
  $("#bExp").onclick=exportBackup; $("#bCsv").onclick=exportCSV; $("#bWipe").onclick=wipeAll;
  $("#bImp").onclick=()=>$("#fImp").click(); $("#fImp").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importBackup(f)};
}

let view="items";

function render(){
  ["items","stats","explore","backup"].forEach(v=>$("#v-"+v).hidden=v!==view);
  $("#hTitle").textContent={items:"Articoli",stats:"Statistiche",explore:"Esplora",backup:"Backup"}[view];

function sortKey(it){ return (it.soldDate||it.listedDate||"")+String(it.createdAt||0).padStart(15,"0"); }
function renderItems(){
  const counts={tutti:items.length,in_vendita:items.filter(x=>x.status==="in_vendita").length,venduto:items.filter(isSold).length,ritirato:items.filter(x=>x.status==="ritirato").length,todo:items.filter(needsReview).length};
  const chips=[["tutti","Tutti"],["in_vendita","In vendita"],["venduto","Venduti"],["todo","Da catalogare"],["ritirato","Ritirati"]].filter(([k])=>k!=="ritirato"||counts.ritirato);
  const q=st.q.trim().toLowerCase();
  let list=items.filter(it=>{
    if(st.filter==="todo"&&!needsReview(it))return false;
    if(!["tutti","todo"].includes(st.filter)&&it.status!==st.filter)return false;
    if(q&&!(`${it.title} ${it.brand} ${it.category} ${it.size} ${it.macro} ${it.color}`.toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>sortKey(b).localeCompare(sortKey(a)));
  const el=$("#v-items");
  const html=`<input class="search" id="q" type="search" placeholder="Cerca per titolo, marca, taglia…" value="${esc(st.q)}">
  <div class="chips">${chips.map(([k,l])=>`<button class="chip ${st.filter===k?"on":""}" data-f="${k}">${l} · ${counts[k]}</button>`).join("")}</div>
  ${st.filter==="todo"&&counts.todo?`<div class="banner">Questi sono gli articoli importati dal PDF che non hai ancora aperto. Ho già indovinato marca e categoria dal titolo dove possibile: aprili, completa e salva.</div>`:""}
  <div class="list">${list.length?list.map(itemRow).join(""):`<div class="empty">${mode==="loading"?"Caricamento…":"Nessun articolo. Tocca + per aggiungerne uno, oppure importa lo storico da Backup."}</div>`}</div>`;
  el.innerHTML=html;
  const qi=$("#q"); qi.oninput=e=>{st.q=e.target.value;const pos=qi.selectionStart;renderItems();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{st.filter=b.dataset.f;renderItems()});
  el.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openSheet(b.dataset.id));
}
function itemRow(it){
  const src=photoSrc(it);
  const meta=[it.brand,it.category&&it.category.replace(/^.*· /,""),it.size,it.macro].filter(Boolean).join(" · ")||"Da catalogare";
  const badge=isSold(it)?`<span class="badge b-sold">Venduto${it.soldDate?" "+it.soldDate.slice(8,10)+"/"+it.soldDate.slice(5,7)+"/"+it.soldDate.slice(2,4):""}</span>`:it.status==="ritirato"?`<span class="badge b-off">Ritirato</span>`:`<span class="badge b-sale">In vendita</span>`;
  const price=isSold(it)?eur(it.sellPrice):(it.listPrice!=null?eur(it.listPrice):"—");
  const p=profitOf(it);
  return `<div class="item" data-id="${esc(it.id)}">
    <div class="thumb">${src?`<img loading="lazy" src="${esc(src)}" alt="">`:esc((it.brand||it.title||"?").charAt(0).toUpperCase())}</div>
    <div class="mid"><div class="t">${esc(it.title)}</div><div class="m">${esc(meta)}</div>${needsReview(it)?`<span class="badge b-todo">Da catalogare</span> `:""}${badge}</div>
    <div class="r"><div class="price">${price}</div>${isSold(it)?`<div class="m" style="color:${p>=0?"var(--good)":"var(--bad)"}">${p>=0?"+":""}${eur(p)}</div>`:it.buyPrice?`<div class="m">pagato ${eur(it.buyPrice)}</div>`:""}</div>
  </div>`;
}

// ---------- stats ----------
function yearsAvailable(){
  const ys=[...new Set(items.filter(isSold).map(soldYear).filter(Boolean))].sort().reverse();
  return ys;
}
function scopeSold(year,month){
  return items.filter(it=>isSold(it)&&(
    year==="all"?true:year==="nodate"?!it.soldDate:soldYear(it)===year)&&(!month||soldMonth(it)===month));
}
function sum(arr,f){return arr.reduce((a,x)=>a+(+f(x)||0),0)}
function metricVal(arr,m){return m==="n"?arr.length:m==="rev"?sum(arr,x=>x.sellPrice):sum(arr,profitOf)}
function fmtMetric(v,m){return m==="n"?String(v):eur0(v)}

function renderStats(){
  const ys=yearsAvailable();
  if(st.year==null) st.year=ys[0]||"all";
  const hasNoDate=items.some(it=>isSold(it)&&!it.soldDate);
  const yOpts=[...ys.map(y=>[y,y]),...(hasNoDate?[["nodate","Senza data"]]:[]),["all","Tutto"]];
  if(!yOpts.some(o=>o[0]===st.year)) st.year=yOpts[0][0];
  const isYear=/^\d{4}$/.test(st.year);
  if(!isYear) st.month=null;
  const scope=scopeSold(st.year,st.month);
  const onSale=items.filter(x=>x.status==="in_vendita");
  const scopeLabel=(st.month?MONTHS_L[st.month-1]+" ":"")+(st.year==="all"?"tutto il periodo":st.year==="nodate"?"vendite senza data (storico)":st.year);
  const rev=sum(scope,x=>x.sellPrice), prof=sum(scope,profitOf);
  const ct=scope.filter(x=>x.contoTerzi).length;
  let h=`<div class="chips">${yOpts.map(([k,l])=>`<button class="chip ${st.year===k?"on":""}" data-y="${k}">${l}</button>`).join("")}</div>
  <div class="hint">Periodo: <b>${esc(scopeLabel)}</b>${st.month?` · <a href="#" id="clrM">tutto l'anno</a>`:""}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">Venduti</div><div class="v">${scope.length}</div><div class="s">${ct?ct+" per conto terzi":"&nbsp;"}</div></div>
    <div class="kpi"><div class="l">Incassato</div><div class="v">${eur(rev)}</div><div class="s">media ${scope.length?eur(rev/scope.length):"—"}</div></div>
    <div class="kpi"><div class="l">Profitto</div><div class="v">${eur(prof)}</div><div class="s">spesa merce ${eur0(sum(scope.filter(x=>!x.contoTerzi),x=>x.buyPrice))}</div></div>
    <div class="kpi"><div class="l">In vendita ora</div><div class="v">${onSale.length}</div><div class="s">capitale fermo ${eur0(sum(onSale,x=>x.buyPrice))}</div></div>
  </div>`;
  if(isYear){
    const per=MONTHS.map((_,i)=>metricVal(scopeSold(st.year,i+1),st.metric));
    const max=Math.max(1,...per);
    h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3 style="margin:0">Mese per mese · ${st.year}</h3>
      <div class="seg">${[["n","Pezzi"],["rev","Incasso"],["profit","Profitto"]].map(([k,l])=>`<button class="${st.metric===k?"on":""}" data-m="${k}">${l}</button>`).join("")}</div></div>
      <div class="months">${per.map((v,i)=>`<div class="mcol ${st.month===i+1?"sel":st.month?"dim":""}" data-mo="${i+1}" title="${MONTHS_L[i]}: ${fmtMetric(v,st.metric)}"><div class="mval">${v?fmtMetric(v,st.metric):""}</div><div class="mbar" style="height:${(Math.max(0,v)/max*100).toFixed(1)}%"></div><div class="mlab">${MONTHS[i]}</div></div>`).join("")}</div>
      <div class="tip">Tocca un mese per vedere marche, categorie e taglie di quel mese.</div></div>`;
  }
  // year table
  const rows=[...ys.map(y=>[y,y]),...(hasNoDate?[["nodate","Senza data"]]:[])];
  if(rows.length){
    h+=`<div class="card"><h3>Anno per anno</h3><table><tr><th>Anno</th><th>Pezzi</th><th>Incasso</th><th>Profitto</th></tr>
    ${rows.map(([k,l])=>{const s=scopeSold(k);return `<tr><td>${l}</td><td>${s.length}</td><td>${eur(sum(s,x=>x.sellPrice))}</td><td>${eur(sum(s,profitOf))}</td></tr>`}).join("")}
    ${rows.length>1?(()=>{const s=scopeSold("all");return `<tr><td><b>Totale</b></td><td><b>${s.length}</b></td><td><b>${eur(sum(s,x=>x.sellPrice))}</b></td><td><b>${eur(sum(s,profitOf))}</b></td></tr>`})():""}
    </table></div>`;
  }
  const dims=[["brand","Per marca"],["category","Per categoria"],["macro","Per reparto"],["size","Per taglia"],["condition","Per condizioni"]];
  dims.forEach(([k,l])=>{h+=breakdown(scope,k,l)});
  $("#v-stats").innerHTML=h;
  const el=$("#v-stats");
  el.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{st.year=b.dataset.y;st.month=null;renderStats()});
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{st.metric=b.dataset.m;renderStats()});
  el.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{const m=+b.dataset.mo;st.month=st.month===m?null:m;renderStats()});
  const c=$("#clrM"); if(c) c.onclick=e=>{e.preventDefault();st.month=null;renderStats()};
  el.querySelectorAll("[data-dim]").forEach(b=>b.onclick=()=>{
    st.ex={status:"venduto",year:/^\d{4}$/.test(st.year)?st.year:st.year==="nodate"?"nodate":"",month:st.month?String(st.month):"",macro:"",category:"",brand:"",size:"",condition:""};
    st.ex[b.dataset.dim]=b.dataset.val; goExplore();
  });
}
function breakdown(scope,key,label){
  const g=new Map();
  scope.forEach(it=>{const v=(it[key]||"").trim();if(!v)return;const k=key==="brand"?v:v;const o=g.get(k)||{n:0,rev:0,p:0};o.n++;o.rev+=+it.sellPrice||0;o.p+=profitOf(it);g.set(k,o)});
  const missing=scope.filter(it=>!(it[key]||"").trim()).length;
  const arr=[...g.entries()].sort((a,b)=>b[1].n-a[1].n||b[1].rev-a[1].rev);
  if(!arr.length) return `<div class="card"><h3>${label}</h3><div class="hint">Nessun dato: ${missing?missing+" articoli venduti non hanno ancora questo campo.":"nessuna vendita nel periodo."}</div></div>`;
  const top=arr.slice(0,10), max=top[0][1].n;
  return `<div class="card"><h3>${label}</h3>${top.map(([k,o])=>`<div class="hb" data-dim="${key}" data-val="${esc(k)}" title="${esc(k)}: ${o.n} pezzi, ${eur(o.rev)}, profitto ${eur(o.p)}">
    <div class="n">${esc(k.replace(/^.*· /,""))}</div><div class="track"><div class="fill" style="width:${(o.n/max*100).toFixed(1)}%"></div></div><div class="v">${o.n} · ${eur0(o.rev)}</div></div>`).join("")}
    ${arr.length>10?`<div class="hint">+ altre ${arr.length-10} voci (vedi Esplora)</div>`:""}
    ${missing?`<div class="hint">${missing} venduti senza ${label.replace("Per ","").replace("condizioni","condizioni indicate")}</div>`:""}</div>`;
}

// ---------- explore ----------
function goExplore(){view="explore";document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("on",x.dataset.v==="explore"));render();window.scrollTo(0,0)}
function uniq(key){return [...new Set(items.map(x=>(x[key]||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"it"))}
function renderExplore(){
  const e=st.ex;
  const ys=[...new Set(items.map(x=>(x.soldDate||x.listedDate||"").slice(0,4)).filter(Boolean))].sort().reverse();
  const sel=(k,label,opts)=>`<label class="f">${label}<select data-ex="${k}"><option value="">Tutti</option>${opts.map(o=>Array.isArray(o)?o:[o,o]).map(([v,l])=>`<option value="${esc(v)}" ${e[k]===v?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
  const res=items.filter(it=>{
    if(e.status&&it.status!==e.status)return false;
    const d=e.status==="venduto"?it.soldDate:(it.status==="venduto"?it.soldDate:it.listedDate);
    if(e.year==="nodate"){ if(d) return false; }
    else if(e.year&&(d||"").slice(0,4)!==e.year)return false;
    if(e.month&&+(d||"").slice(5,7)!==+e.month)return false;
    for(const k of ["macro","category","brand","size","condition"]) if(e[k]&&(it[k]||"").trim().toLowerCase()!==e[k].toLowerCase())return false;
    return true;
  });
  const rev=sum(res,x=>x.sellPrice), prof=sum(res,profitOf);
  const desc=[e.month&&MONTHS_L[e.month-1],e.year==="nodate"?"senza data":e.year,e.category&&e.category.replace(/^.*· /,"").toLowerCase(),e.brand,e.macro&&e.macro.toLowerCase(),e.size&&"taglia "+e.size,e.condition&&e.condition.toLowerCase()].filter(Boolean).join(" · ");
  const verb=e.status==="venduto"?"venduti":e.status==="in_vendita"?"in vendita":e.status==="ritirato"?"ritirati":"articoli";
  $("#v-explore").innerHTML=`<div class="card"><div class="filters">
    ${sel("status","Stato",[["venduto","Venduti"],["in_vendita","In vendita"],["ritirato","Ritirati"]])}
    ${sel("year","Anno",[...ys,["nodate","Senza data"]])}
    ${sel("month","Mese",MONTHS_L.map((m,i)=>[String(i+1),m[0].toUpperCase()+m.slice(1)]))}
    ${sel("macro","Reparto",[...new Set([...MACROS,...uniq("macro")])])}
    ${sel("category","Categoria",uniq("category"))}
    ${sel("brand","Marca",uniq("brand"))}
    ${sel("size","Taglia",uniq("size"))}
    ${sel("condition","Condizioni",uniq("condition"))}
  </div><button class="btn full" style="margin-top:10px" id="exReset">Azzera filtri</button></div>
  <div class="card"><div class="result"><b>${res.length}</b> ${verb}${desc?` · ${esc(desc)}`:""}</div>
  ${e.status!=="in_vendita"&&e.status!=="ritirato"?`<div class="hint" style="margin-top:6px">Incassato ${eur(rev)} · profitto ${eur(prof)}${res.length?` · prezzo medio ${eur(rev/res.length)}`:""}</div>`:`<div class="hint" style="margin-top:6px">Valore annunci ${eur(sum(res,x=>x.listPrice))} · pagati ${eur(sum(res,x=>x.buyPrice))}</div>`}</div>
  <div class="list">${res.sort((a,b)=>sortKey(b).localeCompare(sortKey(a))).map(itemRow).join("")}</div>`;
  const el=$("#v-explore");
  el.querySelectorAll("[data-ex]").forEach(s=>s.onchange=()=>{st.ex[s.dataset.ex]=s.value;renderExplore()});
  $("#exReset").onclick=()=>{st.ex={status:"venduto",year:"",month:"",macro:"",category:"",brand:"",size:"",condition:""};renderExplore()};
  el.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openSheet(b.dataset.id));
}

  $("#profitBox").innerHTML=t;
}
["status","contoTerzi","buyPrice","sellPrice","listPrice","myProfit"].forEach(n=>F[n].addEventListener("input",updateDyn));
F.status.addEventListener("change",()=>{if(F.status.value==="venduto"&&!F.soldDate.value)F.soldDate.value=today();updateDyn()});
$("#btnSold").onclick=()=>{F.status.value="venduto";if(!F.soldDate.value)F.soldDate.value=today();if(!F.sellPrice.value&&F.listPrice.value)F.sellPrice.value=F.listPrice.value;updateDyn();F.sellPrice.focus()};

function showPhoto(src){
  $("#photoBox").innerHTML=src?`<img src="${esc(src)}" alt=""><button type="button" class="rm" id="rmPhoto">Rimuovi</button>`:`<span>📷 Aggiungi foto di copertina</span>`;
  const rm=$("#rmPhoto"); if(rm) rm.onclick=ev=>{ev.stopPropagation();photo={id:"",data:"",dirty:true,pendingBlob:null,preview:""};showPhoto("")};
}
$("#photoBox").onclick=()=>$("#photoInput").click();
$("#photoInput").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const big=await resize(f,1200,.82);
    photo={id:"",data:"",dirty:true,pendingBlob:big,preview:URL.createObjectURL(big)};
    showPhoto(photo.preview);
  }catch(err){ toast("Immagine non leggibile"); }
};
function resize(file,max,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);c.toBlob(b=>b?res(b):rej(),"image/jpeg",q);URL.revokeObjectURL(img.src)};img.onerror=rej;img.src=URL.createObjectURL(file)})}

function openSheet(id){
  editing=id?items.find(x=>x.id===id):null;
  const it=editing||{status:"in_vendita",listedDate:today()};
  $("#sheetTitle").textContent=editing?"Modifica articolo":"Nuovo articolo";
  F.reset();
  fillSelect(F.macro,MACROS,it.macro||"","—");
  fillSelect(F.category,categoriesFor(it.macro||""),it.category||"","—");
  fillSelect(F.condition,CONDITIONS,it.condition||"","—");
  for(const k of ["title","brand","size","color","notes","listedDate","soldDate"]) F[k].value=it[k]||"";
  for(const k of ["buyPrice","listPrice","sellPrice","myProfit"]) F[k].value=it[k]!=null?String(it[k]).replace(".",","):"";
  F.status.value=it.status||"in_vendita"; F.contoTerzi.checked=!!it.contoTerzi;
  photo={id:it.photoId||"",data:it.photoData||"",dirty:false,pendingBlob:null,preview:""};
  showPhoto(photoSrc(it));
  $("#btnDelete").hidden=!editing;
  $("#legacyHint").textContent=editing&&editing.legacy?"Articolo importato dal file Vendite_Vinted (riga "+editing.order+"). Senza data di vendita conta nello storico \"Senza data\": se te la ricordi, inseriscila e finirà nel mese giusto.":"";
  sizeOptions(); updateDyn();
  $("#sheet").classList.add("open"); $("#sheet").scrollTop=0;
}
function closeSheet(){ $("#sheet").classList.remove("open"); if(photo.preview) URL.revokeObjectURL(photo.preview); }
$("#btnCancel").onclick=closeSheet;
$("#fab").onclick=()=>openSheet(null);
$("#btnDelete").onclick=async()=>{
  if(!editing) return;
  if(!await confirmBox(`Eliminare <b>${esc(editing.title)}</b>? Non si può annullare.`)) return;
  try{ await delItem(editing.id); closeSheet(); toast("Eliminato"); }catch(e){ toast("Errore: "+(e.code||"eliminazione non riuscita")); }
};
let saving=false;
$("#btnSave").onclick=async()=>{
  if(saving) return;
  const title=F.title.value.trim(); if(!title){ F.title.focus(); toast("Serve almeno il titolo"); return; }
  if(F.status.value==="venduto"&&num(F.sellPrice.value)==null){ F.sellPrice.focus(); toast("Inserisci il prezzo di vendita"); return; }
  saving=true; $("#btnSave").textContent="…";
  try{
    const base=editing?{...editing}:{createdAt:Date.now(),legacy:false};
    delete base.id;
    let photoId=base.photoId||"", photoData=base.photoData||"";
    if(photo.dirty){
      if(photoId) await delPhoto(photoId);
      photoId=""; photoData="";
      if(photo.pendingBlob) photoId=await savePhoto(photo.pendingBlob);
    }
    const data={...base,
      title, brand:F.brand.value.trim(), macro:F.macro.value, category:F.category.value, size:F.size.value.trim(),
      condition:F.condition.value, color:F.color.value.trim(),
      buyPrice:num(F.buyPrice.value)||0, listPrice:num(F.listPrice.value), sellPrice:F.status.value==="venduto"?num(F.sellPrice.value):num(F.sellPrice.value),
      status:F.status.value, listedDate:F.listedDate.value, soldDate:F.status.value==="venduto"?F.soldDate.value:"",
      contoTerzi:F.contoTerzi.checked, myProfit:F.contoTerzi.checked?(num(F.myProfit.value)||0):null,
      notes:F.notes.value.trim(), photoId, photoData, reviewed:true, updatedAt:Date.now()};
    await putItem(editing?editing.id:null,data);
    closeSheet(); toast("Salvato");
  }catch(e){
    toast(e&&e.name==="QuotaExceededError"?"Spazio esaurito sul telefono":"Salvataggio non riuscito, riprova");
  }finally{ saving=false; $("#btnSave").textContent="Salva"; }
};
window.addEventListener("popstate",()=>{ if($("#sheet").classList.contains("open")) closeSheet(); });

init();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
